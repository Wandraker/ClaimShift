name: Feature request
description: Suggest a focused ClaimShift improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What server/admin/player problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Relevant claim provider
      placeholder: WorldGuard / Lands / provider-independent
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
