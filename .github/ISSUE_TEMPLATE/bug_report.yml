name: Bug report
description: Report a reproducible ClaimShift problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a ClaimShift bug. Do not include passwords, tokens, private keys, database credentials, or other secrets.
  - type: input
    id: claimshift-version
    attributes:
      label: ClaimShift version
      placeholder: 1.3.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Server platform
      options:
        - Paper
        - Purpur
        - Leaf
        - Folia
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: Exact server build
      placeholder: Leaf 26.2-87 / Paper 26.2 build ...
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: 25.0.x
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Claim provider and version
      placeholder: WorldGuard 7.0.18 / Lands 7.x
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: /claimshift info
      description: Paste the complete output.
      render: text
    validations:
      required: true
  - type: textarea
    id: inspect
    attributes:
      label: /claimshift inspect
      description: If the issue is location/claim related, paste the output while standing in the affected claim.
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: region
    attributes:
      label: Relevant claim/region configuration
      description: Include WorldGuard priorities/parents/important flags or equivalent provider details. Remove private information.
  - type: textarea
    id: logs
    attributes:
      label: Relevant console output
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
