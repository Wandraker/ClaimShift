config-version: 3

language:
  config: en_US
  messages: en_US

integration:
  provider: auto

  worldguard:
    mode: dynamic-passthrough
    manage-all-owned-regions: false
    auto-manage-new-regions: true
    manage-existing-passthrough-regions: false
    included-regions: []
    excluded-regions:
      - __global__
    reconcile-interval: 30s

  lands:
    mode: overlay

metrics:
  enabled: true

diagnostics:
  dry-run: true
  log-transitions: true
  operator-notice: true

debug: false
