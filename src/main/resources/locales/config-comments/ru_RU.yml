config-version:
- Внутренняя версия схемы конфигурации. Не изменяйте вручную.
language:
  config:
  - Язык комментариев во всех YAML-конфигах ClaimShift.
  messages:
  - Язык встроенных сообщений игрокам и администрации. Свои сообщения не перезаписываются.
integration:
  provider:
  - 'Система приватов: auto, worldguard или lands. auto выбирает полноценный динамический провайдер; Lands overlay нужно выбирать явно.'
  worldguard:
    mode:
    - 'dynamic-passthrough создаёт настоящие окна рейда: в OPEN/GRACE регион получает passthrough ALLOW.'
    - В PROTECTED ClaimShift возвращает точное значение passthrough, которое было до его вмешательства.
    - overlay не меняет флаги WorldGuard и только добавляет запреты ClaimShift.
    manage-all-owned-regions:
    - 'Безопасное значение — false: существующие регионы WorldGuard не меняются динамически, пока администратор явно их не включит.'
    - Поставьте true для управления всеми физическими не-глобальными регионами с владельцами; спавн/магазины/ивенты оставляйте статичными через claimshift-dynamic deny или исключения.
    - Административные регионы без владельцев игнорируются. Унаследованные владельцы родительских регионов учитываются.
    auto-manage-new-regions:
    - Автоматически управлять подходящими регионами WorldGuard, впервые созданными во время работы ClaimShift.
    - Регионы, уже существующие при первом обнаружении мира, записываются как старые/статичные, поэтому установка плагина не переводит старые приваты в динамический режим.
    - Новый регион всегда можно оставить статичным через claimshift-dynamic deny или excluded-regions.
    manage-existing-passthrough-regions:
    - Если false, регионы с passthrough ALLOW, установленным до ClaimShift, не трогаются.
    included-regions:
    - 'Используется при manage-all-owned-regions: false. Поддерживает region, world:region и маски * / ?.'
    excluded-regions:
    - Регионы, которыми ClaimShift никогда не должен управлять. Поддерживает region, world:region и * / ?.
    - Флаг claimshift-dynamic deny имеет приоритет и оставляет конкретный регион статичным.
    reconcile-interval:
    - Страховочный интервал синхронизации WorldGuard. Вход/выход владельца также запускает синхронизацию сразу.
  lands:
    mode:
    - Интеграция Lands сейчас поддерживает только режим overlay.
metrics:
  enabled:
  - Включить анонимную статистику ClaimShift через bStats.
  - Отправляется стандартная статистика bStats и общие параметры ClaimShift: политика присутствия, провайдер, режим WorldGuard, язык сообщений, Smart Presence, поиск паттернов и глобальный переключатель рейд-сессий.
  - Пользовательские графики ClaimShift не содержат идентификаторы игроков, названия регионов или адрес сервера.
  - Глобальное отключение bStats в plugins/bStats/config.yml всегда учитывается.
debug:
- Включить дополнительную диагностику ClaimShift в консоли сервера.
diagnostics:
  dry-run:
  - Безопасный режим первого запуска. Пока он включён, ClaimShift только показывает решения и не меняет WorldGuard/не блокирует действия.
  log-transitions:
  - Показывать изменения dry-run в консоли. Одинаковые повторные записи подавляются.
  operator-notice:
  - Показывать операторам уведомление title/чат, пока dry-run включён.
