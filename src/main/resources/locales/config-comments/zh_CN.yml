config-version:
- 内部配置结构版本，请勿手动修改。
language:
  config:
  - ClaimShift YAML 配置文件注释所使用的语言。
  messages:
  - 内置玩家/管理员消息的语言。自定义消息不会被覆盖。
integration:
  provider:
  - 领地系统：auto、worldguard 或 lands。auto 会选择完整的动态系统；Lands overlay 需要显式选择。
  worldguard:
    mode:
    - WorldGuard 模式。dynamic-passthrough 会创建真实的可突袭窗口；overlay 只添加 ClaimShift 保护。
    manage-all-owned-regions:
    - 为 false 时，不会自动动态管理现有 WorldGuard 区域。
    auto-manage-new-regions:
    - 自动管理在 ClaimShift 运行期间首次创建且符合条件的 WorldGuard 区域。
    - ClaimShift 首次识别某个世界时已经存在的区域会被记录为旧/静态区域，因此安装插件不会自动转换旧领地。
    - 新区域仍可通过 claimshift-dynamic deny 或 excluded-regions 强制保持静态。
    manage-existing-passthrough-regions:
    - 为 false 时，ClaimShift 不会修改原本已有 passthrough ALLOW 的区域。
    included-regions:
    - 要纳入管理的区域。支持 region、world:region 以及 * / ? 通配符。
    excluded-regions:
    - ClaimShift 永远不应管理的区域。claimshift-dynamic deny 优先级更高。
    reconcile-interval:
    - WorldGuard 动态状态的安全同步间隔。玩家加入/退出也会立即触发同步。
  lands:
    mode:
    - Lands 当前仅支持 overlay。
metrics:
  enabled:
  - 通过 bStats 启用 ClaimShift 匿名统计。
  - 除标准 bStats 数据外，仅提交 ClaimShift 的粗粒度配置：在线策略、领地提供器、WorldGuard 模式、消息语言、Smart Presence、周期模式检测和全局突袭会话开关。
  - ClaimShift 自定义图表不会包含玩家标识、区域名称或服务器地址。
  - 始终遵守 plugins/bStats/config.yml 中的服务器全局退出设置。
debug:
- 在服务器控制台启用更多 ClaimShift 诊断信息。
diagnostics:
  dry-run:
  - 首次安装安全模式。启用时 ClaimShift 只预览决策，不修改 WorldGuard 状态，也不拦截操作。
  log-transitions:
  - 将 dry-run 状态变化记录到控制台；相同的重复预览会被抑制。
  operator-notice:
  - dry-run 启用时向管理员显示标题和聊天提示。
