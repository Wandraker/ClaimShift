config-version:
- Внутрішня версія схеми правил. Не змінюйте вручну.
protection:
  enabled:
  - Головний перемикач захисту ClaimShift і динамічного доступу WorldGuard.
  presence-policy:
  - Визначає, за якого стану активних власників приват доступний для рейду.
  - 'online-open: хоча б один активний власник = OPEN; перед зміною стану застосовуються окремі затримки owner-active та owner-inactive.'
  - 'offline-open: хоча б один активний власник = PROTECTED; після зникнення останнього активного власника приват лишається
    захищеним протягом owner-inactive, а потім стає OPEN. Якщо активний власник повертається до вже відкритого привату, owner-active
    затримує відновлення захисту.'
  transition-delays:
    owner-active:
    - Затримка після появи першого активного власника перед переходом у стан для активного власника.
    - 'У стандартному offline-open це затримка відновлення захисту. Типове значення нової установки: 5m. 0 або 0s вимикає
      затримку.'
    owner-inactive:
    - Затримка після зникнення останнього активного власника перед переходом у стан без активних власників.
    - 'У стандартному offline-open це час до відкриття привату для рейду. Типове значення нової установки: 1h. 0 або 0s вимикає
      затримку.'
  protect-unknown-offline-owners:
  - Якщо true, привати з невідомим часом виходу після рестарту залишаються захищеними.
  trusted-players-bypass:
  - Дозволяє власникам і довіреним/member гравцям користуватися своєю територією.
  actions:
    block-break:
    - Ламання блоків гравцями.
    block-place:
    - Встановлення блоків гравцями.
    containers:
    - Відкриття та зміна інвентарів.
    container-automation:
    - Автоматизація контейнерів через захищені межі.
    interactions:
    - Взаємодії з блоками без інвентарю.
    entity-damage:
    - Шкода неігровим сутностям.
    entity-interact:
    - Взаємодії із сутностями.
    entity-grief:
    - Зміни блоків сутностями.
    hanging:
    - Картини та рамки.
    buckets:
    - Дії з відрами.
    explosions:
    - Руйнування блоків вибухами.
    pistons:
    - Рух поршнів через захищені межі.
    fluids:
    - Потік води/лави через захищені межі.
    fire:
    - Вогонь і поширення через захищені межі.
notifications:
  cooldown:
  - Мінімальний час між повторними повідомленнями про заборону одному гравцю.
presence:
  smart:
    enabled:
    - Smart Presence може вважати підключеного, але бездіяльного власника фактично відсутнім.
    idle-timeout:
    - Час без осмисленої активності, після якого онлайн-гравець вважається неактивним.
    minimum-movement-distance:
    - Мінімальна відстань від останньої врахованої позиції, щоб рух вважався осмисленою активністю. Дрібні рухи та повороти
      камери не оновлюють присутність.
    external-afk:
      enabled:
      - Використовувати AFK-статус CMI/EssentialsX, якщо ці плагіни встановлені.
      cmi:
      - Використовувати AFK-статус CMI, якщо інтеграція доступна.
      essentialsx:
      - Використовувати AFK-статус EssentialsX, якщо інтеграція доступна.
    patterns:
      enabled:
      - Виявляти прості періодичні keep-alive дії, наприклад стрибок або команду кожні кілька хвилин.
      minimum-samples:
      - Кількість однакових повторів, після якої періодичний шаблон перестає вважатися осмисленою активністю.
      minimum-interval:
      - Лише низькочастотні повтори з таким або більшим інтервалом вважаються можливим AFK keep-alive.
      interval-tolerance:
      - Максимальний розкид інтервалів, за якого послідовність вважається періодичною.
  anti-relog:
    enabled:
    - Опціональна anti-relog перевірка. Типово вимкнена, оскільки змінює звичайну поведінку повторного входу.
    window:
    - Повторні входи в межах цього вікна проходять період підтвердження.
    qualification-time:
    - Скільки часу після такого входу гравець має залишатися онлайн, перш ніж знову вважатиметься активним власником.
  max-continuous-presence:
    enabled:
    - Опціональний жорсткий ліміт безперервної онлайн-сесії. Типово вимкнений.
    duration:
    - Максимальний безперервний час онлайн, після якого власник перестає вважатися активним.
raids:
  enabled:
  - 'Опціональне рейд-блокування: рейд, розпочатий у OPEN, може утримувати регіон відкритим протягом сесії.'
  inactivity-timeout:
  - Завершити рейд-сесію після цього часу без відповідної рейдової активності.
  maximum-duration:
  - Жорстка максимальна тривалість рейд-сесії, щоб регіон не можна було утримувати відкритим безкінечно.
  extend-on-activity:
  - Оновлювати таймер бездіяльності, доки триває відповідна рейдова активність.
  trigger-actions:
  - Ключі дій захисту, які можуть почати або продовжити рейд, поки регіон уже перебуває в OPEN.
