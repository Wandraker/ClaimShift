config-version:
- Internal rules schema version. Do not change it manually.
protection:
  enabled:
  - Master switch for ClaimShift protection and dynamic WorldGuard access.
  presence-policy:
  - Controls which active-owner presence state is raidable.
  - 'online-open: at least one active owner = OPEN; when active presence changes, owner-active/owner-inactive transition delays
    are applied before switching state.'
  - 'offline-open: at least one active owner = PROTECTED; after the last active owner becomes inactive, the claim remains
    protected for owner-inactive, then becomes OPEN. When an active owner returns to an already OPEN claim, owner-active delays
    protection recovery.'
  transition-delays:
    owner-active:
    - Delay after the first active owner appears before the active-owner state takes effect.
    - 'In the default offline-open policy this is the protection recovery delay. Fresh-install default: 5m. Use 0 or 0s for
      an immediate transition.'
    owner-inactive:
    - Delay after the last active owner stops counting as present before the no-active-owner state takes effect.
    - 'In the default offline-open policy this is the delay before a claim becomes raidable. Fresh-install default: 1h. Use
      0 or 0s for an immediate transition.'
  protect-unknown-offline-owners:
  - If true, claims whose offline timestamp is unknown after restart fail closed and remain protected until ClaimShift observes
    owner presence again.
  trusted-players-bypass:
  - Allow owners and trusted/member players to use their own territory while ClaimShift protection is active.
  actions:
    block-break:
    - Block breaking by players.
    block-place:
    - Block placement by players.
    containers:
    - Opening and modifying block/entity inventories. Existing open views are re-checked after protection activates.
    container-automation:
    - Hopper-style item movement and pickup across a protected claim boundary.
    interactions:
    - Non-container block interactions, including physical interactions such as pressure plates.
    entity-damage:
    - Player/projectile attacks and destructive entity-vs-entity damage against non-player entities.
    entity-interact:
    - Right-click entity actions, armor stands, shearing, leash/unleash, and placed entities.
    entity-grief:
    - Entity-driven block changes such as Endermen and similar mechanics.
    hanging:
    - 'Paintings/item frames: placement, breaking, and item-frame content changes.'
    buckets:
    - Bucket fill/empty actions and capturing entities in buckets.
    explosions:
    - Block destruction caused by entity and block explosions.
    pistons:
    - Piston movement across protected claim boundaries; internal movement remains allowed.
    fluids:
    - Water/lava flow across protected claim boundaries; internal flow remains allowed.
    fire:
    - Ignition/burning and fire spread across protected claim boundaries.
notifications:
  cooldown:
  - Minimum time between repeated denial messages sent to the same player.
presence:
  smart:
    enabled:
    - Smart Presence can treat connected-but-idle owners as effectively absent.
    idle-timeout:
    - How long without meaningful activity before an online player becomes inactive.
    minimum-movement-distance:
    - Minimum distance from the last accepted movement anchor before movement counts as meaningful activity. Small jitter
      and looking around do not refresh presence.
    external-afk:
      enabled:
      - Use CMI/EssentialsX AFK state when those plugins are installed.
      cmi:
      - Use CMI AFK state when available.
      essentialsx:
      - Use EssentialsX AFK state when available.
    patterns:
      enabled:
      - Detect simple low-frequency periodic keep-alive actions such as a jump or command every few minutes.
      minimum-samples:
      - Number of matching samples required before a periodic pattern stops counting as meaningful activity.
      minimum-interval:
      - Only low-frequency repetitions at or above this interval are considered AFK keep-alive candidates.
      interval-tolerance:
      - Maximum spread between repeated intervals for a sequence to be considered periodic.
  anti-relog:
    enabled:
    - Optional anti-relog qualification. Disabled by default because it changes normal reconnect behaviour.
    window:
    - Reconnects within this window are subject to the qualification period.
    qualification-time:
    - How long a qualifying reconnect must remain online before it counts as active presence again.
  max-continuous-presence:
    enabled:
    - Optional hard cap for one continuous protected online session. Disabled by default.
    duration:
    - Maximum continuous online time before the owner stops counting as active presence.
raids:
  enabled:
  - Optional raid lock. A raid started while a claim is OPEN can keep it OPEN for the configured session window.
  inactivity-timeout:
  - End the raid session after this long without qualifying raid activity.
  maximum-duration:
  - Hard maximum raid-session duration. Use a generous value to prevent indefinite locks.
  extend-on-activity:
  - Refresh the inactivity timeout when qualifying raid activity continues.
  trigger-actions:
  - Protection action keys that may start or extend a raid while the claim is already OPEN.
