config-version:
- Versión interna del esquema de reglas. No la cambies manualmente.
protection:
  enabled:
  - Interruptor principal de la protección de ClaimShift y del acceso dinámico de WorldGuard.
  presence-policy:
  - Controla qué estado de presencia de propietarios activos puede ser asaltado.
  - 'online-open: al menos un propietario activo = OPEN; antes de cambiar se aplican los retrasos owner-active y owner-inactive.'
  - 'offline-open: al menos un propietario activo = PROTECTED; tras desaparecer el último propietario activo, el claim sigue
    protegido durante owner-inactive y después pasa a OPEN. Si un propietario activo vuelve a un claim ya abierto, owner-active
    retrasa la recuperación de la protección.'
  transition-delays:
    owner-active:
    - Retraso después de aparecer el primer propietario activo antes de aplicar el estado activo.
    - 'En offline-open por defecto es el retraso de recuperación de protección. Valor inicial: 5m. Usa 0 o 0s para desactivarlo.'
    owner-inactive:
    - Retraso después de dejar de haber propietarios activos antes de aplicar el estado inactivo.
    - 'En offline-open por defecto es el tiempo antes de que el claim sea asaltable. Valor inicial: 1h. Usa 0 o 0s para desactivarlo.'
  protect-unknown-offline-owners:
  - Si es true, los claims con hora de desconexión desconocida tras un reinicio permanecen protegidos.
  trusted-players-bypass:
  - Permite a propietarios y jugadores de confianza/member usar su propio territorio.
  actions:
    block-break:
    - Rotura de bloques por jugadores.
    block-place:
    - Colocación de bloques por jugadores.
    containers:
    - Apertura y modificación de inventarios.
    container-automation:
    - Automatización de contenedores a través de límites protegidos.
    interactions:
    - Interacciones con bloques sin inventario.
    entity-damage:
    - Daño a entidades que no son jugadores.
    entity-interact:
    - Interacciones con entidades.
    entity-grief:
    - Cambios de bloques causados por entidades.
    hanging:
    - Cuadros y marcos.
    buckets:
    - Acciones con cubos.
    explosions:
    - Destrucción de bloques por explosiones.
    pistons:
    - Movimiento de pistones a través de límites protegidos.
    fluids:
    - Flujo de agua/lava a través de límites protegidos.
    fire:
    - Fuego y propagación del fuego a través de límites protegidos.
notifications:
  cooldown:
  - Tiempo mínimo entre mensajes de denegación repetidos al mismo jugador.
presence:
  smart:
    enabled:
    - Smart Presence puede tratar a propietarios conectados pero inactivos como ausentes.
    idle-timeout:
    - Tiempo sin actividad significativa antes de considerar inactivo a un jugador conectado.
    minimum-movement-distance:
    - Distancia mínima desde la última posición aceptada para que el movimiento cuente como actividad significativa. Pequeños
      movimientos y mirar alrededor no reinician la presencia.
    external-afk:
      enabled:
      - Usar el estado AFK de CMI/EssentialsX si esos plugins están instalados.
      cmi:
      - Usar el estado AFK de CMI cuando la integración esté disponible.
      essentialsx:
      - Usar el estado AFK de EssentialsX cuando la integración esté disponible.
    patterns:
      enabled:
      - Detectar acciones periódicas simples de keep-alive, como saltar o ejecutar un comando cada pocos minutos.
      minimum-samples:
      - Cantidad de repeticiones coincidentes necesaria antes de dejar de contar el patrón como actividad significativa.
      minimum-interval:
      - Solo las repeticiones de baja frecuencia con este intervalo o mayor se consideran posibles keep-alive AFK.
      interval-tolerance:
      - Variación máxima entre intervalos para considerar periódica una secuencia.
  anti-relog:
    enabled:
    - Calificación anti-relog opcional. Está desactivada por defecto porque cambia el comportamiento normal al reconectar.
    window:
    - Las reconexiones dentro de este intervalo deben superar el período de calificación.
    qualification-time:
    - Tiempo que una reconexión calificada debe permanecer en línea antes de volver a contar como presencia activa.
  max-continuous-presence:
    enabled:
    - Límite duro opcional para una sesión continua en línea. Desactivado por defecto.
    duration:
    - Tiempo máximo conectado de forma continua antes de que el propietario deje de contar como activo.
raids:
  enabled:
  - 'Bloqueo de raid opcional: un raid iniciado en OPEN puede mantener el claim abierto durante la sesión.'
  inactivity-timeout:
  - Finalizar la sesión de raid tras este tiempo sin actividad de raid válida.
  maximum-duration:
  - Duración máxima absoluta de una sesión de raid para evitar bloqueos indefinidos.
  extend-on-activity:
  - Reiniciar el temporizador de inactividad mientras continúe actividad de raid válida.
  trigger-actions:
  - Claves de acciones de protección que pueden iniciar o prolongar un raid mientras el claim ya está OPEN.
