config-version:
- Внутренняя версия схемы правил. Не изменяйте вручную.
protection:
  enabled:
  - Главный переключатель защиты ClaimShift и динамического доступа WorldGuard.
  presence-policy:
  - Определяет, при каком состоянии активных владельцев приват доступен для рейда.
  - 'online-open: хотя бы один активный владелец = ОТКРЫТ; перед сменой состояния применяются отдельные задержки owner-active
    и owner-inactive.'
  - 'offline-open: хотя бы один активный владелец = ЗАЩИЩЁН; после исчезновения последнего активного владельца приват остаётся
    защищённым на owner-inactive, затем становится ОТКРЫТ. Если владелец вернулся в уже открытый приват, owner-active задерживает
    восстановление защиты.'
  transition-delays:
    owner-active:
    - Задержка после появления первого активного владельца перед переходом в состояние для активного владельца.
    - 'В стандартном offline-open это задержка восстановления защиты. Дефолт новой установки: 5m. Значение 0 или 0s отключает
      задержку.'
    owner-inactive:
    - Задержка после того, как последний активный владелец перестал считаться присутствующим, перед состоянием без активных
      владельцев.
    - 'В стандартном offline-open это время до открытия привата для рейда. Дефолт новой установки: 1h. Значение 0 или 0s отключает
      задержку.'
  protect-unknown-offline-owners:
  - Если true, после рестарта приват с неизвестным временем выхода владельца безопасно остаётся защищённым, пока ClaimShift
    снова не увидит присутствие владельца.
  trusted-players-bypass:
  - Разрешать владельцам и доверенным игрокам/member пользоваться своим приватом, когда защита ClaimShift активна.
  actions:
    block-break:
    - Ломание блоков игроками.
    block-place:
    - Установка блоков игроками.
    containers:
    - Открытие и изменение инвентарей блоков/сущностей. Уже открытые окна повторно проверяются после включения защиты.
    container-automation:
    - Перемещение/подбор предметов воронками через границу защищённого привата.
    interactions:
    - Взаимодействия с блоками без инвентаря, включая физические действия вроде нажимных плит.
    entity-damage:
    - Атаки игрока/снарядов и разрушительный урон сущность-сущность по неигровым сущностям.
    entity-interact:
    - ПКМ по сущностям, стойки для брони, стрижка, поводки и установка сущностей.
    entity-grief:
    - 'Изменение блоков сущностями: эндермены и похожие механики.'
    hanging:
    - 'Картины/рамки: установка, разрушение и изменение содержимого рамок.'
    buckets:
    - Наполнение/опустошение вёдер и захват сущностей в ведро.
    explosions:
    - Разрушение блоков взрывами сущностей и блоков.
    pistons:
    - Работа поршней через границу защищённого привата; внутри привата механика не блокируется.
    fluids:
    - Течение воды/лавы через границу защищённого привата; внутреннее течение не блокируется.
    fire:
    - Поджог/сгорание и распространение огня через границу защищённого привата.
notifications:
  cooldown:
  - Минимальный интервал между повторными сообщениями о запрете одному игроку.
presence:
  smart:
    enabled:
    - Умное присутствие может считать подключённого, но бездействующего владельца фактически отсутствующим.
    idle-timeout:
    - Время без осмысленной активности, после которого онлайн-игрок считается неактивным.
    minimum-movement-distance:
    - Минимальное расстояние от последней учтённой позиции, чтобы движение считалось осмысленной активностью. Мелкие колебания
      и повороты камеры таймер не обновляют.
    external-afk:
      enabled:
      - Использовать AFK-статус CMI/EssentialsX, если эти плагины установлены.
      cmi:
      - Учитывать AFK-статус CMI, если интеграция доступна.
      essentialsx:
      - Учитывать AFK-статус EssentialsX, если интеграция доступна.
    patterns:
      enabled:
      - 'Обнаруживать простые периодические keep-alive действия: например прыжок или команду каждые несколько минут.'
      minimum-samples:
      - Количество совпадающих повторов, после которого периодическое действие перестаёт считаться осмысленной активностью.
      minimum-interval:
      - Только низкочастотные повторы с таким или большим интервалом рассматриваются как AFK keep-alive.
      interval-tolerance:
      - Максимальный разброс интервалов, при котором последовательность считается периодической.
  anti-relog:
    enabled:
    - Опциональная защита от перелогов. По умолчанию выключена, потому что меняет обычное поведение переподключения.
    window:
    - Переподключения в пределах этого окна проходят дополнительный период подтверждения активности.
    qualification-time:
    - Сколько времени после такого переподключения игрок должен оставаться онлайн, прежде чем снова будет считаться активным
      владельцем.
  max-continuous-presence:
    enabled:
    - Опциональный жёсткий лимит непрерывной онлайн-сессии. По умолчанию выключен.
    duration:
    - Максимальное непрерывное время онлайн, после которого владелец перестаёт считаться активным.
raids:
  enabled:
  - 'Опциональная рейд-блокировка: рейд, начатый пока регион OPEN, может удерживать его открытым на время рейд-сессии.'
  inactivity-timeout:
  - Завершить рейд-сессию после этого времени без подходящей рейдовой активности.
  maximum-duration:
  - Жёсткий максимальный срок рейд-сессии, не позволяющий удерживать регион открытым бесконечно.
  extend-on-activity:
  - Обновлять таймер бездействия, пока продолжается подходящая рейдовая активность.
  trigger-actions:
  - Ключи действий защиты, которые могут начать или продлить рейд, пока регион уже находится в OPEN.
