config-version:
- Внутренняя версия схемы правил. Не изменяйте вручную.
protection:
  enabled:
  - Главный переключатель защиты ClaimShift и динамического доступа WorldGuard.
  presence-policy:
  - Определяет, при каком присутствии владельцев приват доступен для рейда.
  - 'online-open: хотя бы один владелец онлайн = ОТКРЫТ; после выхода последнего приват остаётся открытым на offline-delay, затем становится ЗАЩИЩЁН.'
  - 'offline-open: хотя бы один владелец онлайн = ЗАЩИЩЁН; после выхода последнего приват остаётся защищённым на offline-delay, затем становится ОТКРЫТ.'
  offline-delay:
  - Задержка после выхода последнего эффективного владельца перед переходом в настроенное офлайн-состояние.
  - 'Примеры: 30s, 1m, 10m, 1h. Для мгновенного перехода используйте 0s.'
  protect-unknown-offline-owners:
  - Если true, после рестарта приват с неизвестным временем выхода владельца безопасно остаётся защищённым, пока ClaimShift снова не увидит присутствие владельца.
  trusted-players-bypass:
  - Разрешать владельцам и доверенным игрокам/member пользоваться своим приватом, когда защита ClaimShift активна.
  actions:
    block-break:
    - Ломание блоков игроками.
    block-place:
    - Установка блоков игроками.
    containers:
    - Открытие и изменение инвентарей блоков/сущностей. Уже открытые окна повторно проверяются после включения защиты.
    container-automation:
    - Перемещение/подбор предметов воронками через границу защищённого привата.
    interactions:
    - Взаимодействия с блоками без инвентаря, включая физические действия вроде нажимных плит.
    entity-damage:
    - Атаки игрока/снарядов и разрушительный урон сущность-сущность по неигровым сущностям.
    entity-interact:
    - ПКМ по сущностям, стойки для брони, стрижка, поводки и установка сущностей.
    entity-grief:
    - 'Изменение блоков сущностями: эндермены и похожие механики.'
    hanging:
    - 'Картины/рамки: установка, разрушение и изменение содержимого рамок.'
    buckets:
    - Наполнение/опустошение вёдер и захват сущностей в ведро.
    explosions:
    - Разрушение блоков взрывами сущностей и блоков.
    pistons:
    - Работа поршней через границу защищённого привата; внутри привата механика не блокируется.
    fluids:
    - Течение воды/лавы через границу защищённого привата; внутреннее течение не блокируется.
    fire:
    - Поджог/сгорание и распространение огня через границу защищённого привата.
notifications:
  cooldown:
  - Минимальный интервал между повторными сообщениями о запрете одному игроку.
