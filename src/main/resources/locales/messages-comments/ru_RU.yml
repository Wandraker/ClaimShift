config-version:
- Внутренняя версия схемы. Не изменяйте это значение вручную.
theme:
- HEX-цвета, доступные как именованные MiniMessage-теги, например <primary> и <error>.
prefix:
- Полностью настраиваемый MiniMessage-префикс.
messages:
- Необязательные свои сообщения. Отсутствующие ключи всегда берутся из language.messages.
- Смена языка никогда не заменяет пользовательское переопределение.
